<!-- Create a login page using different form elements. -->
<HTML>

<HEAD>

  <head>
    <style>
      body {
        background-color: #b2ebf2;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      div {
        width: 350px;
        border: 3px solid black;
        padding: 50px 150px 50px 150px;
        margin: 100px 450px;

      }
    </style>
    <TITLE> REGISTRATION FORM </TITLE>
  </HEAD>

<BODY>
  <div>
    <h1>
      <FONT Face='Times New Roman' color='#00838f' size=18px>LOGIN FORM</FONT>
    </h1>
    <FORM>
      <FONT Face='Times New Roman' color='#00838f' size='5'>
        Enter Username: <INPUT TYPE="TEXT" NAME="TXTNAME" required><BR><br>
        Enter Password: <INPUT TYPE="PASSWORD" NAME="PWD"><BR><br>
        <INPUT TYPE="Submit" VALUE="Submit">
        <INPUT TYPE="Reset" VALUE="Reset">
      </font>
    </FORM>
  </DIV>
</BODY>

</HTML>
