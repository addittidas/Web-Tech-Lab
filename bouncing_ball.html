<html>

<head>
  <style>
    div {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: red;
      position: relative;
      animation-name: example;
      animation-duration: 1s;
      animation-iteration-count: infinite;
    }

    @keyframes example {
      0% {
        background-color: red;
        left: 0px;
        top: 0px;
      }

      50% {
        background-color: yellow;
        left: 0px;
        top: 200px;
      }

      100% {
        background-color: red;
        left: 0px;
        top: 0px;
      }

    }
  </style>
</head>

<body>
  <div>
  </div>
</body>

</html>
