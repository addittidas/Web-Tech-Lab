<!-- Using HTML, CSS creates a zoom in zoom out animation. -->
 
<html>

<head>
    <title> zoom </title>
    <style>
        H2 {
            text-align: center;
            padding: 20px;
        }

        div {
            margin: 50px 0px 0px 680px;
            width: 100px;
            height: 100px;
            background: #f500cc;
            animation: zoom-in-zoom-out 1s ease infinite;
        }

        @keyframes zoom-in-zoom-out {
            0% {
                transform: scale(0.7, 0.7);
            }

            50% {
                transform: scale(1, 1);
            }

            100% {
                transform: scale(0.7, 0.7);
            }
        }
    </style>
</head>

<body>
    <H2> Zoom In Zoom Out Effect </H2>
    <div>

    </div>
</body>

</html>
