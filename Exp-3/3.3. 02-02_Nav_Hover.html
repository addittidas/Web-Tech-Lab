<!-- Using HTML and CSS, create a custom hover and focus effect for navigation items, using CSS transformations. -->

<html>

<head>

  <title>Navigation Hover</title>
  <style>
    body {
      font-family: Times New Roman;
      FONT-SIZE: 20PX;
      margin: 0;
      padding: 0;
    }



    ul {
      background-color: #512da8;
      padding: 10px 0;
      list-style-type: none;
      margin: 0;


    }

    li {
      display: inline-block;
      margin: 0 10px;
    }

    a {
      color: #fff;
      text-decoration: none;
      padding: 5px 10px;
      display: block;
      transition: transform 0.3s ease;
    }

    a:hover,
    a:focus {
      transform: scale(1.1);
    }
  </style>
</head>

<body>


  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>


</body>

</html>
