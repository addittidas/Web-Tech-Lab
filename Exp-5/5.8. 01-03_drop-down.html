<!-- Write a JavaScript program to populate a drop-down box from 1 to 1000. -->

<html>

<head>
</head>

<body>
	<h3>A JavaScript program to populate a drop-down box from 1 to 1000.</h3>
	<form name="frm">
		<label for="drop">Drop-down from 1 to 1000:</label>
		<select id="drop"> </select>

		<script>

			var drdn = document.getElementById("drop");
			for (var i = 1; i <= 1000; i++) {
				var option = document.createElement("option");
				option.value = i;
				option.textContent = i;
				drdn.appendChild(option);
			}

		</script>

	</form>
</body>

</html>
