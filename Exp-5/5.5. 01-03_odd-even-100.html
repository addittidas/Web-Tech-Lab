<!-- Write a JavaScript program to find odd and even numbers from 1 to 100. -->

<html>

<head>
</head>

<body>
  <h3>A JavaScript program to find odd and even numbers from 1 to 100.</h3>
  <script>
    document.write("<h4>Odd Numbers:</h4>");
    for (let i = 1; i <= 100; i += 2) {
      document.write(i + " ");
    }

    document.write("<h4>Even Numbers:</h4>");
    for (let i = 2; i <= 100; i += 2) {
      document.write(i + " ");
    }
  </script>

</body>

</html>
